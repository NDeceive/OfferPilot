# Optional backend-only local credentials; supports launching from backend or repository root.
spring.config.import=optional:file:./config/ai.local.properties,optional:file:./后端/config/ai.local.properties
ai.enabled=${AI_ENABLED:true}


digital-human.enabled=${DIGITAL_HUMAN_ENABLED:true}
digital-human.base-url=${DIGITAL_HUMAN_BASE_URL:http://127.0.0.1:8010}
digital-human.timeout-ms=${DIGITAL_HUMAN_TIMEOUT_MS:20000}
digital-human.launcher.enabled=${DIGITAL_HUMAN_LAUNCHER_ENABLED:true}
digital-human.launcher.workdir=${DIGITAL_HUMAN_LAUNCHER_WORKDIR:数字人}
digital-human.launcher.script=${DIGITAL_HUMAN_LAUNCHER_SCRIPT:start_offerpilot_digital_human.bat}
digital-human.launcher.startup-wait-ms=${DIGITAL_HUMAN_STARTUP_WAIT_MS:120000}
digital-human.launcher.stop-on-shutdown=${DIGITAL_HUMAN_STOP_ON_SHUTDOWN:true}

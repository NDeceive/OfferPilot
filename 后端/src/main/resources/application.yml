server:
  port: 8080

spring:
  application:
    name: zhimian-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhimian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 数据库密码：优先读环境变量 DB_PASSWORD；未设置时回退到本地开发默认值 123456。
    # 生产环境请用 prod profile（application-prod.yml），那里强制要求注入 DB_PASSWORD。
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # JWT 签名密钥：优先读环境变量 JWT_SECRET；未设置时回退到本地开发占位值。
  # 注意：HS256 要求密钥至少 256 位（32 个 ASCII 字符），故此默认值需足够长。
  # 该默认值仅供本地开发使用，生产环境必须通过 JWT_SECRET 环境变量注入随机密钥。
  secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-123456}
  # token 有效期（毫秒），默认 7 天
  expiration: 604800000

# AI 大模型配置（DeepSeek，OpenAI 兼容接口）
ai:
  provider: ${AI_PROVIDER:deepseek}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  # DeepSeek；换回智谱时改 provider/base-url/model 三行即可
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}
  # 是否启用真实 AI 调用；false 时使用内置规则/模拟（无 key 也能演示）
  enabled: true
  # 调用超时（毫秒），同时作为连接与读取超时
  timeout-ms: 60000

# Resume AI only. DeepSeek API Key is supplied by the backend environment, never by the browser.
resume-ai:
  deepseek:
    enabled: ${RESUME_DEEPSEEK_ENABLED:true}
    base-url: ${DEEPSEEK_RESUME_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_RESUME_MODEL:deepseek-flash}
    api-key: ${DEEPSEEK_RESUME_API_KEY:}

# 智谱 GLM-ASR-2512 文件转写
asr:
  base-url: ${ZHIPU_ASR_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  # 免费 key，随仓库分发；环境变量 ZHIPU_API_KEY 可覆盖
  api-key: ${ZHIPU_API_KEY:f2eef235e2284bb38480fbe167e8bb77.6flCCwdm4I4cdNOi}
  model: ${ZHIPU_ASR_MODEL:glm-asr-2512}
  timeout-ms: 60000
  max-file-size: 10485760
  max-duration-seconds: 30

# Judge0 CE 是可选的自部署判题服务。保持 false 时不会请求任何外部服务。
judge:
  enabled: ${JUDGE_ENABLED:false}
  base-url: ${JUDGE_BASE_URL:}
  auth-token: ${JUDGE_AUTH_TOKEN:}
  timeout-ms: ${JUDGE_TIMEOUT_MS:15000}
  language-ids:
    java: ${JUDGE_LANGUAGE_JAVA:0}

# 本地数字人服务。开发环境启动 Spring Boot 时自动检查并拉起。
digital-human:
  enabled: ${DIGITAL_HUMAN_ENABLED:true}
  base-url: ${DIGITAL_HUMAN_BASE_URL:http://127.0.0.1:8010}
  timeout-ms: ${DIGITAL_HUMAN_TIMEOUT_MS:20000}
  launcher:
    enabled: ${DIGITAL_HUMAN_LAUNCHER_ENABLED:true}
    workdir: ${DIGITAL_HUMAN_LAUNCHER_WORKDIR:数字人}
    script: ${DIGITAL_HUMAN_LAUNCHER_SCRIPT:start_offerpilot_digital_human.bat}
    startup-wait-ms: ${DIGITAL_HUMAN_STARTUP_WAIT_MS:120000}
    stop-on-shutdown: ${DIGITAL_HUMAN_STOP_ON_SHUTDOWN:true}

# CORS 允许的前端来源（逗号分隔）。开发默认放行本地 Vite 前端 + 本地预览工具的任意端口
# （localhost/127.0.0.1:[*] 通配，见 WebConfig 的 allowedOriginPatterns——HBuilderX 内置
# 浏览器等工具每次用随机端口，写死端口会 403）。
# "null" 和 "file://" 两条是给 HBuilderX 5+App 用的：APK 里页面以 file:// 加载，跨域请求的
# Origin 头取决于 WebView 的本地文件访问开关——开了（DCloud 默认）发 "file://"，没开则发
# "null"，所以两个都放行。
# 生产白名单在 application-prod.yml，保持 fail-closed。
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,null,file://,http://localhost:[*],http://127.0.0.1:[*]}"

# 会议 WebSocket（/ws/meeting）握手允许的 Origin（逗号分隔），与 HTTP CORS 白名单相互独立：
# 局域网演示时前端 IP 可能天天变，复刻 CORS 白名单会频繁 403，开发默认放行所有来源；
# 生产在 application-prod.yml 用 MEETING_WS_ALLOWED_ORIGINS 注入具体来源（未注入 = 锁死跨域握手）。
meeting:
  ws:
    allowed-origins: "${MEETING_WS_ALLOWED_ORIGINS:*}"

# 多层追问：第 k 层条件概率 p = p0 * gamma^(k-1) * phi
# 关闭 enabled 后退回单层追问的旧行为，便于对比实验。
interview:
  followup:
    enabled: "${INTERVIEW_FOLLOWUP_ENABLED:true}"
    p0: "${INTERVIEW_FOLLOWUP_P0:0.90}"
    gamma: "${INTERVIEW_FOLLOWUP_GAMMA:0.55}"
    max-depth: "${INTERVIEW_FOLLOWUP_MAX_DEPTH:4}"
    depth-by-difficulty: "${INTERVIEW_FOLLOWUP_DEPTH:2,3,4}"
    min-time-left-seconds: "${INTERVIEW_FOLLOWUP_MIN_TIME_LEFT:90}"
    quality-min: "${INTERVIEW_FOLLOWUP_QUALITY_MIN:0.70}"
    quality-max: "${INTERVIEW_FOLLOWUP_QUALITY_MAX:1.30}"
    seed-salt: "${INTERVIEW_FOLLOWUP_SEED_SALT:offerpilot}"
  # 作答录音落盘目录；语音分析边车地址
  audio:
    dir: "${INTERVIEW_AUDIO_DIR:data/answer-audio}"
  voice:
    enabled: "${INTERVIEW_VOICE_ENABLED:true}"
    service-url: "${INTERVIEW_VOICE_URL:http://127.0.0.1:8020}"
    timeout-ms: "${INTERVIEW_VOICE_TIMEOUT_MS:20000}"

logging:
  level:
    com.zhimian: debug

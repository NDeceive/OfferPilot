server:
  port: 8080

spring:
  application:
    name: zhimian-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhimian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 数据库密码：优先读环境变量 DB_PASSWORD；未设置时回退到本地开发默认值 123456。
    # 生产环境请用 prod profile（application-prod.yml），那里强制要求注入 DB_PASSWORD。
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # JWT 签名密钥：优先读环境变量 JWT_SECRET；未设置时回退到本地开发占位值。
  # 注意：HS256 要求密钥至少 256 位（32 个 ASCII 字符），故此默认值需足够长。
  # 该默认值仅供本地开发使用，生产环境必须通过 JWT_SECRET 环境变量注入随机密钥。
  secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-123456}
  # token 有效期（毫秒），默认 7 天
  expiration: 604800000

# AI 大模型配置（智谱，OpenAI 兼容接口）
ai:
  provider: zhipu
  base-url: ${ZHIPU_LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  # 大模型与 ASR 共用智谱密钥，只从环境变量读取。
  api-key: ${ZHIPU_API_KEY:}
  model: ${ZHIPU_LLM_MODEL:glm-4.7-flash}
  # 是否启用真实 AI 调用；false 时使用内置规则/模拟（无 key 也能演示）
  enabled: true
  # 调用超时（毫秒），同时作为连接与读取超时
  timeout-ms: 20000

# Resume AI only. DeepSeek API Key is supplied by the backend environment, never by the browser.
resume-ai:
  deepseek:
    enabled: ${RESUME_DEEPSEEK_ENABLED:true}
    base-url: ${DEEPSEEK_RESUME_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_RESUME_MODEL:deepseek-flash}
    api-key: ${DEEPSEEK_RESUME_API_KEY:}

# 智谱 GLM-ASR-2512 文件转写
asr:
  base-url: ${ZHIPU_ASR_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  api-key: ${ZHIPU_API_KEY:}
  model: ${ZHIPU_ASR_MODEL:glm-asr-2512}
  timeout-ms: 60000
  max-file-size: 10485760
  max-duration-seconds: 30

# Judge0 CE 是可选的自部署判题服务。保持 false 时不会请求任何外部服务。
judge:
  enabled: ${JUDGE_ENABLED:false}
  base-url: ${JUDGE_BASE_URL:}
  auth-token: ${JUDGE_AUTH_TOKEN:}
  timeout-ms: ${JUDGE_TIMEOUT_MS:15000}
  language-ids:
    java: ${JUDGE_LANGUAGE_JAVA:62}

# 本地数字人服务。开发环境启动 Spring Boot 时自动检查并拉起。
digital-human:
  enabled: ${DIGITAL_HUMAN_ENABLED:true}
  base-url: ${DIGITAL_HUMAN_BASE_URL:http://127.0.0.1:8010}
  timeout-ms: ${DIGITAL_HUMAN_TIMEOUT_MS:20000}
  launcher:
    enabled: ${DIGITAL_HUMAN_LAUNCHER_ENABLED:true}
    workdir: ${DIGITAL_HUMAN_LAUNCHER_WORKDIR:数字人}
    script: ${DIGITAL_HUMAN_LAUNCHER_SCRIPT:start_offerpilot_digital_human.bat}
    startup-wait-ms: ${DIGITAL_HUMAN_STARTUP_WAIT_MS:120000}
    stop-on-shutdown: ${DIGITAL_HUMAN_STOP_ON_SHUTDOWN:true}

# CORS 允许的前端来源（逗号分隔）。开发默认放行本地 Vite 前端，避免影响本地联调。
# 生产环境用固定白名单（见 application-prod.yml），不再使用通配符。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

logging:
  level:
    com.zhimian: debug
